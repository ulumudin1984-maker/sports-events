const INITIAL_LEADERBOARD = [
    { rank: 1, nickname: 'Budi_Runner', xp: 1850, level: 'Sports Champion', badgesCount: 6, activities: 12, isSample: true },
    { rank: 2, nickname: 'Siti_Smash', xp: 1420, level: 'Pro Organizer', badgesCount: 5, activities: 10, isSample: true },
    { rank: 3, nickname: 'Doni_Dunk', xp: 1100, level: 'Pro Organizer', badgesCount: 4, activities: 8, isSample: true },
    { rank: 4, nickname: 'Nia_Relay', xp: 850, level: 'Challenger', badgesCount: 3, activities: 6, isSample: true },
    { rank: 5, nickname: 'Rizky_Goal', xp: 600, level: 'Challenger', badgesCount: 2, activities: 4, isSample: true }
];

function App() {
    // Navigation State
    const [currentView, setCurrentView] = useState('home');
    const [sidebarOpen, setSidebarOpen] = useState(false);

    // User Profile & Gamification State
    const [userNickname, setUserNickname] = useState(() => localStorage.getItem('se_nickname') || 'Guest Student');
    const [xp, setXp] = useState(() => parseInt(localStorage.getItem('se_xp')) || 0);
    const [completedActivities, setCompletedActivities] = useState(() => JSON.parse(localStorage.getItem('se_completed')) || []);
    const [unlockedBadges, setUnlockedBadges] = useState(() => JSON.parse(localStorage.getItem('se_badges')) || []);
    const [lastQuizScore, setLastQuizScore] = useState(() => localStorage.getItem('se_last_quiz') || null);

    // Dynamic Data States (Managed via Teacher Dashboard)
    const [modules, setModules] = useState(() => JSON.parse(localStorage.getItem('se_modules')) || INITIAL_MODULES);
    const [announcementData, setAnnouncementData] = useState(() => JSON.parse(localStorage.getItem('se_announcement')) || INITIAL_ANNOUNCEMENT);
    const [quizQuestions, setQuizQuestions] = useState(() => JSON.parse(localStorage.getItem('se_quiz_q')) || INITIAL_QUIZ_QUESTIONS);
    const [videoUrl, setVideoUrl] = useState(() => localStorage.getItem('se_video_url') || 'https://www.youtube.com/embed/dQw4w9WgXcQ');
    const [objectivesStatus, setObjectivesStatus] = useState(() => JSON.parse(localStorage.getItem('se_obj_status')) || [false, false, false, false, false]);

    // Toast/Alert System
    const [toastMessage, setToastMessage] = useState(null);

    const showToast = (msg, type = 'info') => {
        setToastMessage({ text: msg, type });
        setTimeout(() => setToastMessage(null), 3500);
    };

    // Calculate Level based on XP
    const userLevel = useMemo(() => {
        if (xp >= 1500) return 'Sports Champion';
        if (xp >= 1000) return 'Pro Organizer';
        if (xp >= 500) return 'Challenger';
        return 'Rookie';
    }, [xp]);

    // XP & Badge Manager function
    const awardXp = (amount, activityId, badgeName = null) => {
        let newXp = xp;
        let updatedActivities = [...completedActivities];
        
        if (!completedActivities.includes(activityId)) {
            newXp += amount;
            updatedActivities.push(activityId);
            setXp(newXp);
            setCompletedActivities(updatedActivities);
            localStorage.setItem('se_xp', newXp.toString());
            localStorage.setItem('se_completed', JSON.stringify(updatedActivities));
            showToast(`+${amount} XP Gained! Great job!`, 'success');
            
            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
            }
        } else {
            showToast(`Activity already completed! Keep practicing.`, 'info');
        }

        if (badgeName && !unlockedBadges.includes(badgeName)) {
            const updatedBadges = [...unlockedBadges, badgeName];
            setUnlockedBadges(updatedBadges);
            localStorage.setItem('se_badges', JSON.stringify(updatedBadges));
            showToast(`🏆 Badge Unlocked: ${badgeName}!`, 'success');
        }
    };

    // Text-to-Speech Helper
    const speakText = (text) => {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        } else {
            showToast('Speech synthesis not supported in this browser.', 'warning');
        }
    };

    // Persist Nickname
    const handleSaveNickname = (name) => {
        setUserNickname(name);
        localStorage.setItem('se_nickname', name);
        showToast('Nickname updated!', 'success');
    };

    // Reset Progress
    const handleResetData = () => {
        if (window.confirm("Apakah Anda yakin ingin mereset seluruh progres belajar?")) {
            localStorage.clear();
            setXp(0);
            setCompletedActivities([]);
            setUnlockedBadges([]);
            setLastQuizScore(null);
            setModules(INITIAL_MODULES);
            setAnnouncementData(INITIAL_ANNOUNCEMENT);
            setQuizQuestions(INITIAL_QUIZ_QUESTIONS);
            setObjectivesStatus([false, false, false, false, false]);
            showToast('Seluruh data berhasil direset.', 'info');
        }
    };

    // Guidance Mascot Component
    const MascotGuide = ({ character = 'Alya', message }) => {
        const mascots = {
            Alya: { name: 'Alya', role: 'Ketua Panitia Sports Day', color: 'bg-pink-100 text-pink-700 border-pink-300', avatar: '👩‍💼' },
            Raka: { name: 'Raka', role: 'Koordinator Pertandingan', color: 'bg-blue-100 text-blue-700 border-blue-300', avatar: '🏃‍♂️' },
            CoachBima: { name: 'Coach Bima', role: 'Mentor Olahraga', color: 'bg-emerald-100 text-emerald-700 border-emerald-300', avatar: '🧢' }
        };
        const current = mascots[character] || mascots.Alya;

        return (
            <div className={`p-4 rounded-2xl border-2 ${current.color} flex items-start space-x-3 shadow-sm mb-6 transition-all`}>
                <div className="text-3xl p-2 bg-white rounded-xl shadow-inner">{current.avatar}</div>
                <div>
                    <div className="flex items-center space-x-2">
                        <span className="font-bold text-sm">{current.name}</span>
                        <span className="text-xs px-2 py-0.5 rounded-full bg-white bg-opacity-70">{current.role}</span>
                    </div>
                    <p className="text-sm mt-1 leading-relaxed font-medium">{message}</p>
                </div>
            </div>
        );
    };

    return (
        <div className="flex h-screen overflow-hidden bg-slate-50">
            {/* Toast Notification */}
            {toastMessage && (
                <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-lg font-semibold text-sm flex items-center space-x-2 transition-all transform translate-y-0 ${
                    toastMessage.type === 'success' ? 'bg-emerald-500 text-white' :
                    toastMessage.type === 'warning' ? 'bg-amber-500 text-white' : 'bg-sky-600 text-white'
                }`}>
                    <span>{toastMessage.text}</span>
                </div>
            )}

            {/* Sidebar Desktop */}
            <aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col`}>
                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-sky-500 text-white">
                    <div className="flex items-center space-x-2">
                        <div className="bg-white p-2 rounded-xl text-sky-600 font-extrabold text-xl shadow-sm">🏆</div>
                        <div>
                            <h1 className="font-bold text-base leading-tight">SPORTS EVENTS</h1>
                            <p className="text-xs text-sky-100 font-medium">Play, Learn, & Win!</p>
                        </div>
                    </div>
                    <button className="md:hidden text-white" onClick={() => setSidebarOpen(false)}>✕</button>
                </div>

                {/* Navigation Items */}
                <nav className="flex-1 overflow-y-auto p-3 space-y-1">
                    {[
                        { id: 'home', label: 'Home Dashboard', icon: '🏠' },
                        { id: 'objectives', label: 'Learning Objectives', icon: '🎯' },
                        { id: 'materials', label: 'Learning Materials', icon: '📚' },
                        { id: 'announcement', label: 'Event Announcement', icon: '📢' },
                        { id: 'video', label: 'Video Learning', icon: '🎥' },
                        { id: 'flashcards', label: 'Vocabulary Flashcards', icon: '🂠' },
                        { id: 'dragdrop', label: 'Drag & Drop Challenge', icon: '🧩' },
                        { id: 'mysterybox', label: 'Mystery Box Game', icon: '🎁' },
                        { id: 'spinwheel', label: 'Spin The Wheel', icon: '🎡' },
                        { id: 'quiz', label: 'Interactive Quiz', icon: '📝' },
                        { id: 'leaderboard', label: 'Leaderboard', icon: '🥇' },
                        { id: 'reflection', label: 'Reflection & Evaluation', icon: '🪞' },
                        { id: 'teacher', label: 'Teacher Dashboard', icon: '🧑‍🏫' }
                    ].map((menu) => (
                        <button
                            key={menu.id}
                            onClick={() => { setCurrentView(menu.id); setSidebarOpen(false); }}
                            className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all ${
                                currentView === menu.id 
                                ? 'bg-sky-500 text-white shadow-md font-semibold' 
                                : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                            }`}
                        >
                            <span className="text-lg">{menu.icon}</span>
                            <span className="truncate">{menu.label}</span>
                        </button>
                    ))}
                </nav>

                {/* User Stats Mini Panel */}
                <div className="p-3 border-t border-slate-100 bg-slate-50">
                    <div className="flex items-center space-x-3 bg-white p-2.5 rounded-xl shadow-sm border border-slate-200">
                        <div className="w-9 h-9 rounded-full bg-amber-100 border border-amber-300 flex items-center justify-center font-bold text-amber-700">
                            ⚽
                        </div>
                        <div className="flex-1 min-w-0">
                            <p className="text-xs font-bold text-slate-800 truncate">{userNickname}</p>
                            <div className="flex items-center space-x-2 text-[11px] text-slate-500 font-semibold">
                                <span className="text-sky-600">{xp} XP</span>
                                <span>•</span>
                                <span className="text-amber-600">{userLevel}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            {/* Main Content Area */}

function ObjectivesView({ status, setStatus, MascotGuide, showToast }) {
    const objectives = [
        "Identifikasi fungsi sosial, struktur teks, dan unsur kebahasaan teks announcement terkait Sports Events.",
        "Gunakan vocabulary spesifik dunia olahraga (venue, participant, referee, relay race) dengan tepat.",
        "Terapkan ungkapan masa depan (will, be going to, scheduled to) dalam mengomunikasikan rencana kegiatan.",
        "Membedakan pernyataan fakta (fact) dan opini (opinion) dalam teks ulasan / laporan acara olahraga.",
        "Susun draf perencanaan dan pengumuman Sports Day sekolah secara terstruktur dan santun."
    ];

    const toggleObjective = (index) => {
        const nextStatus = [...status];
        nextStatus[index] = !nextStatus[index];
        setStatus(nextStatus);
        localStorage.setItem('se_obj_status', JSON.stringify(nextStatus));
        showToast(nextStatus[index] ? 'Target ditandai selesai!' : 'Target dibatalkan.', 'info');
    };

    const completedCount = status.filter(Boolean).length;
    const progressPercent = Math.round((completedCount / objectives.length) * 100);

    return (
        <div className="space-y-6">
            <MascotGuide character="CoachBima" message="Tujuan Pembelajaran ini disesuaikan dengan CP & ATP Bahasa Inggris SMA Kelas X (Fase E). Centang indikator di bawah setelah Anda menguasai materinya!" />

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <div className="flex items-center justify-between">
                    <h2 className="text-xl font-bold text-slate-800">Learning Objectives (Capaian Pembelajaran)</h2>
                    <span className="text-sm font-extrabold text-sky-600 bg-sky-50 px-3 py-1 rounded-full">{progressPercent}% Mastered</span>
                </div>

                {/* Progress Bar */}
                <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div className="bg-sky-500 h-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                </div>

                <div className="space-y-3 pt-2">
                    {objectives.map((obj, i) => (
                        <div 
                            key={i} 
                            onClick={() => toggleObjective(i)}
                            className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-start space-x-3 ${
                                status[i] ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200 hover:border-sky-300'
                            }`}
                        >
                            <input 
                                type="checkbox" 
                                checked={status[i] || false} 
                                onChange={() => {}} 
                                className="mt-1 h-5 w-5 text-sky-600 rounded focus:ring-sky-500" 
                            />
                            <div className="flex-1">
                                <p className={`text-sm font-medium leading-relaxed ${status[i] ? 'text-emerald-900 font-semibold line-through opacity-80' : 'text-slate-800'}`}>
                                    {obj}
                                </p>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
}

                        <span>(+100 XP)</span>
                    </button>
                </div>
            </div>
        </div>
    );
}

function AnnouncementView({ announcement, MascotGuide, awardXp, showToast }) {
    const [highlightKey, setHighlightKey] = useState(null);
    const [userAnswers, setUserAnswers] = useState({ q1: '', q2: '', q3: '', q4: '', q5: '' });
    const [quizChecked, setQuizChecked] = useState(false);

    const questions = [
        { id: 'q1', text: '1. When will the event take place?', answerKey: '20 November 2026' },
        { id: 'q2', text: '2. Where will the event be held?', answerKey: 'school sports field' },
        { id: 'q3', text: '3. Mention two activities in the announcement.', answerKey: ['relay race', 'basketball', 'badminton', 'team games'] },
        { id: 'q4', text: '4. Who can participate in this event?', answerKey: 'all students' },
        { id: 'q5', text: '5. What is the deadline for registration?', answerKey: '13 November 2026' }
    ];

    const checkComprehension = () => {
        setQuizChecked(true);
        awardXp(150, 'announcement_analysis', 'Announcement Expert');
        showToast('Analisis Pengumuman Selesai! (+150 XP)', 'success');
    };

    return (
        <div className="space-y-6">
            <MascotGuide character="Alya" message="Ini adalah draf pengumuman resmi Sports Day sekolah kita. Klik tombol highlight untuk membedakan struktur informasinya!" />

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {/* Announcement Card Display */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-sky-600 uppercase bg-sky-50 px-3 py-1 rounded-full">Sample Announcement Text</span>
                        <button 
                            onClick={() => window.print()} 
                            className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl font-bold text-slate-700"
                        >
                            🖨️ Print / Download
                        </button>
                    </div>

                    <div className="p-6 bg-amber-50/60 rounded-2xl border-2 border-dashed border-amber-300 relative space-y-3 font-sans">
                        <h3 className={`text-xl font-extrabold text-amber-900 text-center ${highlightKey === 'title' ? 'bg-amber-300 p-1 rounded' : ''}`}>
                            {announcement.title}
                        </h3>
                        <div className="text-sm text-amber-950 leading-relaxed font-medium whitespace-pre-line">
                            {announcement.text}
                        </div>
                    </div>

                    {/* Interactive Highlight Controller */}
                    <div className="space-y-2">
                        <p className="text-xs font-bold text-slate-500 uppercase">Interactive Information Highlighter:</p>
                        <div className="flex flex-wrap gap-2">
                            {[
                                { key: 'date', label: '📅 Date & Time' },
                                { key: 'venue', label: '📍 Venue' },
                                { key: 'activities', label: '⚽ Activities' },
                                { key: 'participants', label: '👥 Participants' },
                                { key: 'deadline', label: '⏳ Registration Deadline' }
                            ].map(h => (
                                <button
                                    key={h.key}
                                    onClick={() => setHighlightKey(highlightKey === h.key ? null : h.key)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                        highlightKey === h.key ? 'bg-sky-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                    }`}
                                >
                                    {h.label}
                                </button>
                            ))}
                        </div>
                        {highlightKey && (
                            <div className="p-3 bg-sky-50 border border-sky-200 rounded-xl text-xs text-sky-900 font-bold">
                                Details: {announcement.details[highlightKey]}
                            </div>
                        )}
                    </div>
                </div>

                {/* Comprehension Questions */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-lg font-bold text-slate-800">Comprehension Questions</h3>

                            <div key={q.id} className="space-y-1.5">
                                <label className="text-xs font-bold text-slate-700">{q.text}</label>

                                    type="text" 
                                    value={userAnswers[q.id]}
                                    onChange={(e) => setUserAnswers({ ...userAnswers, [q.id]: e.target.value })}

                                    <p className="text-[11px] text-emerald-600 font-bold bg-emerald-50 p-2 rounded-lg">

                        ))}
                    </div>

                    <button 
                        onClick={checkComprehension}
                        className="w-full py-3 bg-sky-500 text-white rounded-2xl font-bold text-sm hover:bg-sky-600 shadow-md transition-all"
                    >
                        Submit Answers & Verify

function DragDropView({ MascotGuide, awardXp }) {
    const [gameMode, setGameMode] = useState('mode1'); // mode1: Vocab Match, mode2: Schedule Order

    // Game Mode 1 State
    const vocabPairs = [
        { id: '1', word: 'Venue', match: 'The place where an event takes place' },
        { id: '2', word: 'Participant', match: 'A person who joins an event' },
        { id: '3', word: 'Referee', match: 'An official who enforces rules' },
        { id: '4', word: 'Spectator', match: 'A person who watches an event' }
    ];

    const [selectedWord, setSelectedWord] = useState(null);
    const [matchedIds, setMatchedIds] = useState([]);

    // Game Mode 2 State
    const initialSchedule = [
        'Sports Competitions',
        'Closing Ceremony',
        'Opening Ceremony',
        'Prize-giving Ceremony',
        'Warm-up Session'
    ];
    const correctSchedule = [
        'Opening Ceremony',
        'Warm-up Session',
        'Sports Competitions',
        'Prize-giving Ceremony',
        'Closing Ceremony'
    ];
    const [userSchedule, setUserSchedule] = useState(initialSchedule);
    const [scheduleSuccess, setScheduleSuccess] = useState(false);

    const handleMatchClick = (defMatch) => {
        if (!selectedWord) return;
        if (selectedWord.match === defMatch) {
            setMatchedIds([...matchedIds, selectedWord.id]);
            setSelectedWord(null);
            if (matchedIds.length + 1 === vocabPairs.length) {
                awardXp(150, 'dragdrop_vocab_matched');
            }
        } else {
            setSelectedWord(null);
        }
    };

    const moveScheduleItem = (index, direction) => {
        const updated = [...userSchedule];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= updated.length) return;
        const temp = updated[index];
        updated[index] = updated[targetIndex];
        updated[targetIndex] = temp;
        setUserSchedule(updated);
    };

    const checkScheduleOrder = () => {
        const isCorrect = JSON.stringify(userSchedule) === JSON.stringify(correctSchedule);
        setScheduleSuccess(isCorrect);
        if (isCorrect) {
            awardXp(150, 'schedule_ordered_correctly');
        }
    };

    return (
        <div className="space-y-6">
            <MascotGuide character="Alya" message="Pilih mode tantangan di bawah! Cocokkan kosakata atau susun urutan acara Sports Day dengan benar!" />

            <div className="flex space-x-2 border-b border-slate-200 pb-2">
                <button 
                    onClick={() => setGameMode('mode1')}
                    className={`px-4 py-2 rounded-2xl font-bold text-xs ${gameMode === 'mode1' ? 'bg-sky-500 text-white' : 'bg-white text-slate-600'}`}
                >
                    Mode 1: Vocabulary Matching
                </button>
                <button 
                    onClick={() => setGameMode('mode2')}
                    className={`px-4 py-2 rounded-2xl font-bold text-xs ${gameMode === 'mode2' ? 'bg-sky-500 text-white' : 'bg-white text-slate-600'}`}
                >
                    Mode 2: Arrange Schedule
                </button>
            </div>

            {gameMode === 'mode1' ? (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                    <p className="text-xs text-slate-500 font-semibold">Klik kata di sebelah kiri, lalu klik definisi yang sesuai di sebelah kanan:</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Words Column */}
                        <div className="space-y-3">
                            <h4 className="text-xs font-extrabold uppercase text-slate-400">Words</h4>
                            {vocabPairs.map((item) => (
                                <button
                                    key={item.id}
                                    disabled={matchedIds.includes(item.id)}
                                    onClick={() => setSelectedWord(item)}
                                    className={`w-full p-4 rounded-2xl border text-left font-bold text-sm transition-all ${
                                        matchedIds.includes(item.id) 
                                        ? 'bg-emerald-100 border-emerald-300 text-emerald-800 opacity-60' 
                                        : selectedWord?.id === item.id 
                                        ? 'bg-sky-500 text-white ring-2 ring-sky-300' 
                                        : 'bg-slate-50 border-slate-200 hover:border-sky-300 text-slate-800'
                                    }`}
                                >
                                    {item.word} {matchedIds.includes(item.id) && '✓'}
                                </button>
                            ))}
                        </div>

                        {/* Definitions Column */}
                        <div className="space-y-3">
                            <h4 className="text-xs font-extrabold uppercase text-slate-400">Definitions</h4>
                            {vocabPairs.map((item) => (
                                <button
                                    key={`def_${item.id}`}
                                    disabled={matchedIds.includes(item.id)}
                                    onClick={() => handleMatchClick(item.match)}
                                    className={`w-full p-4 rounded-2xl border text-left font-medium text-xs transition-all ${
                                        matchedIds.includes(item.id) 
                                        ? 'bg-emerald-50 border-emerald-200 text-emerald-800 opacity-60' 
                                        : 'bg-slate-50 border-slate-200 hover:border-sky-300 text-slate-700'
                                    }`}
                                >
                                    {item.match}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            ) : (
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                    <p className="text-xs text-slate-500 font-semibold">Gunakan tombol panah ⬆️ ⬇️ untuk mengurutkan tahapan susunan acara Sports Day yang benar:</p>

                    <div className="space-y-2 max-w-md mx-auto">
                        {userSchedule.map((item, idx) => (
                            <div key={idx} className="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-between">
                                <span className="font-bold text-xs text-slate-800">{idx + 1}. {item}</span>
                                <div className="space-x-1">
                                    <button 
                                        onClick={() => moveScheduleItem(idx, -1)}
                                        className="p-1 bg-white border rounded-lg text-xs"
                                        disabled={idx === 0}
                                    >
                                        ⬆️
                                    </button>
                                    <button 
                                        onClick={() => moveScheduleItem(idx, 1)}
                                        className="p-1 bg-white border rounded-lg text-xs"
                                        disabled={idx === userSchedule.length - 1}
                                    >
                                        ⬇️
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="text-center pt-2">
                        <button 
                            onClick={checkScheduleOrder}
                            className="px-6 py-2.5 bg-sky-500 text-white rounded-2xl font-bold text-xs hover:bg-sky-600 shadow"
                        >
                            Verify Order
                        </button>
                        {scheduleSuccess && (
                            <p className="mt-3 text-xs font-bold text-emerald-600">🎉 Urutan sempurna! (+150 XP)</p>
                        )}
                    </div>
                </div>
            )}
        </div>
    );
}

function SpinWheelView({ MascotGuide, awardXp }) {
    const segments = ['Vocabulary', 'Announcement', 'Future Expr.', 'Fact/Opinion', 'Schedule', 'Sports Trivia', 'Teamwork', 'Bonus XP'];
    const [spinning, setSpinning] = useState(false);
    const [selectedSegment, setSelectedSegment] = useState(null);
    const [rotation, setRotation] = useState(0);

    const spinWheel = () => {
        if (spinning) return;
        setSpinning(true);
        setSelectedSegment(null);

        const randomIndex = Math.floor(Math.random() * segments.length);
        const degPerSegment = 360 / segments.length;
        const extraRounds = 5 * 360;
        const targetDeg = rotation + extraRounds + (360 - (randomIndex * degPerSegment)) - (degPerSegment / 2);

        setRotation(targetDeg);

        setTimeout(() => {
            setSpinning(false);
            setSelectedSegment(segments[randomIndex]);
            awardXp(50, `spin_${Date.now()}`, 'Spin Wheel Champion');
        }, 3500);
    };

    return (
        <div className="space-y-6">
            <MascotGuide character="Raka" message="Putar Roda Keberuntungan (Spin the Wheel) untuk mendapatkan tantangan acak dan bonus XP!" />

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm text-center space-y-6">
                {/* Wheel Graphic Container */}
                <div className="relative w-64 h-64 mx-auto flex items-center justify-center">
                    {/* Indicator Arrow */}
                    <div className="absolute -top-3 z-20 text-3xl text-rose-500 font-bold">▼</div>
                    <div 
                        className="w-full h-full rounded-full border-4 border-slate-800 shadow-xl overflow-hidden relative transition-transform duration-[3500ms] cubic-bezier(0.15, 0.99, 0.35, 1)"
                        style={{ transform: `rotate(${rotation}deg)` }}
                    >
                        <div className="w-full h-full bg-gradient-to-tr from-sky-400 via-amber-300 to-emerald-400 flex items-center justify-center font-extrabold text-slate-800 text-xs">
                            🎯 SPIN ME!
                        </div>
                    </div>
                </div>

                <button 
                    onClick={spinWheel}
                    disabled={spinning}
                    className="px-8 py-3 bg-amber-400 text-slate-900 font-extrabold rounded-2xl shadow-md hover:bg-amber-300 disabled:opacity-50 text-sm"
                >
                    {spinning ? 'Spinning...' : 'SPIN NOW!'}
                </button>

                {selectedSegment && (
                    <div className="p-4 bg-sky-50 border border-sky-200 rounded-2xl max-w-md mx-auto">
                        <span className="text-xs font-bold text-sky-600 uppercase">Selected Segment:</span>
                        <h3 className="text-lg font-extrabold text-slate-800">{selectedSegment}</h3>
                        <p className="text-xs text-slate-600 mt-1">Selamat! Anda menyelesaikan tantangan segmen ini (+50 XP).</p>
                    </div>
                )}
            </div>
        </div>
    );
}

function QuizView({ questions, awardXp, MascotGuide, setLastQuizScore }) {
    const [currentIndex, setCurrentIndex] = useState(0);
    const [selectedAnswers, setSelectedAnswers] = useState({});
    const [submitted, setSubmitted] = useState(false);

    const currentQ = questions[currentIndex];

    const handleSelectOption = (optIdx) => {
        if (submitted) return;
        setSelectedAnswers({ ...selectedAnswers, [currentIndex]: optIdx });
    };

    const calculateScore = () => {
        let correct = 0;
        questions.forEach((q, idx) => {
            if (selectedAnswers[idx] === q.answer) correct++;
        });
        const percent = Math.round((correct / questions.length) * 100);
        setSubmitted(true);
        setLastQuizScore(percent);
        localStorage.setItem('se_last_quiz', percent.toString());

        if (percent >= 70) {
            awardXp(300, 'quiz_passed_70', 'Quiz Winner');
        }
    };

    return (
        <div className="space-y-6">
            <MascotGuide character="CoachBima" message="Kuis Evaluasi Terdiri dari 20 Soal Pilihan Ganda. Selesaikan untuk menguji penguasaan materi Sports Events!" />

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                {!submitted ? (
                    <>
                        {/* Progress Header */}
                        <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">Question {currentIndex + 1} of {questions.length}</span>
                            <span className="text-xs font-bold bg-sky-100 text-sky-700 px-3 py-1 rounded-full">
                                Answered: {Object.keys(selectedAnswers).length}/{questions.length}
                            </span>
                        </div>

                        {/* Question Box */}
                        <div className="space-y-4">
                            <h3 className="text-base md:text-lg font-bold text-slate-800">{currentQ.question}</h3>
                            <div className="space-y-2">
                                {currentQ.options.map((opt, i) => (
                                    <button
                                        key={i}
                                        onClick={() => handleSelectOption(i)}
                                        className={`w-full p-4 rounded-2xl border text-left text-xs md:text-sm font-semibold transition-all ${

                                ))}
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                            <button 
                                disabled={currentIndex === 0}
                                onClick={() => setCurrentIndex(currentIndex - 1)}
                                className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-xs disabled:opacity-40"
                            >
                                ← Previous
                            </button>

                            {currentIndex === questions.length - 1 ? (
                                <button 
                                    onClick={calculateScore}
                                    className="px-6 py-2.5 bg-emerald-500 text-white rounded-xl font-bold text-xs hover:bg-emerald-600 shadow"
                                >
                                    Submit Quiz Final
                                </button>
                            ) : (
                                <button 
                                    onClick={() => setCurrentIndex(currentIndex + 1)}
                                    className="px-4 py-2 bg-sky-500 text-white rounded-xl font-bold text-xs hover:bg-sky-600"
                                >
                                    Next →
                                </button>
                            )}
                        </div>
                    </>
                ) : (
                    /* Results Page */
                    <div className="space-y-6 text-center">
                        <div className="p-6 bg-sky-50 rounded-3xl border border-sky-200 max-w-md mx-auto space-y-2">
                            <span className="text-4xl">🏆</span>
                            <h2 className="text-2xl font-extrabold text-slate-800">Quiz Completed!</h2>
                            <p className="text-3xl font-extrabold text-sky-600">
                                {Math.round((Object.keys(selectedAnswers).filter(k => selectedAnswers[k] === questions[k].answer).length / questions.length) * 100)}%
                            </p>
                            <p className="text-xs text-slate-600">
                                Correct: {Object.keys(selectedAnswers).filter(k => selectedAnswers[k] === questions[k].answer).length} / {questions.length} Questions
                            </p>
                        </div>

                        {/* Explanations Review */}
                        <div className="text-left space-y-4 max-h-96 overflow-y-auto pr-2">
                            <h4 className="font-bold text-sm text-slate-800">Review Answer Explanations:</h4>
                            {questions.map((q, idx) => (
                                <div key={idx} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs space-y-1">
                                    <p className="font-bold text-slate-800">{idx + 1}. {q.question}</p>
                                    <p className={selectedAnswers[idx] === q.answer ? 'text-emerald-600 font-bold' : 'text-rose-600 font-bold'}>
                                        Your Answer: {q.options[selectedAnswers[idx]] || 'Not Answered'}
                                    </p>
                                    <p className="text-slate-600">Correct Answer: {q.options[q.answer]}</p>
                                    <p className="text-slate-500 italic pt-1">💡 {q.explanation}</p>
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={() => { setSubmitted(false); setSelectedAnswers({}); setCurrentIndex(0); }}
                            className="px-6 py-3 bg-sky-500 text-white rounded-2xl font-bold text-xs"
                        >
                            Retake Quiz
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
}

function LeaderboardView({ xp, userNickname, userLevel, unlockedBadges, completedActivities, MascotGuide }) {
    const combinedLeaderboard = useMemo(() => {
        const currentUserData = {
            rank: 0,
            nickname: `${userNickname} (You)`,
            xp: xp,
            level: userLevel,
            badgesCount: unlockedBadges.length,
            activities: completedActivities.length,
            isUser: true
        };

        const list = [...INITIAL_LEADERBOARD, currentUserData];
        list.sort((a, b) => b.xp - a.xp || b.activities - a.activities);
        return list.map((item, idx) => ({ ...item, rank: idx + 1 }));
    }, [xp, userNickname, userLevel, unlockedBadges, completedActivities]);

    return (
        <div className="space-y-6">
            <MascotGuide character="Alya" message="Papan Peringkat (Leaderboard) menampilkan skor XP siswa. Tingkatkan aktivitas belajar untuk meraih posisi puncak!" />

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <h3 className="text-lg font-bold text-slate-800">Sports Events Top Champions</h3>

                <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="border-b border-slate-200 text-xs text-slate-400 font-bold uppercase">
                                <th className="p-3">Rank</th>
                                <th className="p-3">Student Nickname</th>
                                <th className="p-3">XP Points</th>
                                <th className="p-3">Level</th>
                                <th className="p-3">Badges</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-xs font-semibold">
                            {combinedLeaderboard.map((player) => (
                                <tr key={player.rank} className={player.isUser ? 'bg-amber-50 font-extrabold text-amber-900' : 'text-slate-700'}>
                                    <td className="p-3">
                                        {player.rank === 1 ? '🥇 1' : player.rank === 2 ? '🥈 2' : player.rank === 3 ? '🥉 3' : `#${player.rank}`}
                                    </td>
                                    <td className="p-3">{player.nickname}</td>
                                    <td className="p-3 text-sky-600 font-bold">{player.xp} XP</td>
                                    <td className="p-3"><span className="bg-slate-100 px-2 py-0.5 rounded-full">{player.level}</span></td>
                                    <td className="p-3">{player.badgesCount} 🏆</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}

function ReflectionView({ lastQuizScore, completedCount, MascotGuide, awardXp, showToast }) {
    const [answers, setAnswers] = useState({
        q1: '', q2: '', q3: '', q4: '', q5: '', selfRating: 5
    });

    const handleSaveReflection = () => {
        localStorage.setItem('se_reflection', JSON.stringify(answers));
        awardXp(100, 'reflection_submitted', 'Teamwork Hero');
        showToast('Refleksi berhasil disimpan! (+100 XP)', 'success');
    };

    return (
        <div className="space-y-6">
            <MascotGuide character="CoachBima" message="Isi lembar refleksi mandiri di bawah untuk mereview pencapaian belajar Anda sepanjang materi Sports Events!" />

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                <h3 className="text-xl font-bold text-slate-800">Self Reflection & Learning Summary</h3>

                {/* Summary Card */}
                <div className="grid grid-cols-2 gap-4 bg-sky-50 p-4 rounded-2xl border border-sky-100">
                    <div>
                        <p className="text-xs text-slate-500">Latest Quiz Score:</p>
                        <p className="text-lg font-extrabold text-sky-700">{lastQuizScore ? `${lastQuizScore}%` : 'Not Taken'}</p>
                    </div>
                    <div>
                        <p className="text-xs text-slate-500">Activities Completed:</p>
                        <p className="text-lg font-extrabold text-emerald-700">{completedCount} Modules/Games</p>
                    </div>
                </div>

                <div className="space-y-4">
                    <div>
                        <label className="text-xs font-bold text-slate-700">1. What new vocabulary did you learn?</label>
                        <textarea rows="2" value={answers.q1} onChange={(e) => setAnswers({ ...answers, q1: e.target.value })} className="w-full mt-1 p-2.5 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-sky-400" placeholder="Tuliskan kosakata baru..."></textarea>
                    </div>
                    <div>
                        <label className="text-xs font-bold text-slate-700">2. What information should an event announcement include?</label>
                        <textarea rows="2" value={answers.q2} onChange={(e) => setAnswers({ ...answers, q2: e.target.value })} className="w-full mt-1 p-2.5 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-sky-400" placeholder="Tuliskan komponen announcement..."></textarea>
                    </div>
                    <div>
                        <label className="text-xs font-bold text-slate-700">3. How can students show good sportsmanship?</label>
                        <textarea rows="2" value={answers.q4} onChange={(e) => setAnswers({ ...answers, q4: e.target.value })} className="w-full mt-1 p-2.5 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-sky-400" placeholder="Pendapat Anda tentang sikap sportif..."></textarea>
                    </div>

                    <div>
                        <label className="text-xs font-bold text-slate-700">Self Assessment Rating (1 - 5):</label>
                        <div className="flex space-x-3 mt-2">
                            {[1, 2, 3, 4, 5].map((star) => (
                                <button 
                                    key={star} 
                                    onClick={() => setAnswers({ ...answers, selfRating: star })}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold ${answers.selfRating === star ? 'bg-amber-400 text-slate-900' : 'bg-slate-100 text-slate-600'}`}
                                >
                                    {star} ⭐
                                </button>
                            ))}
                        </div>
                    </div>
                </div>

                <button 
                    onClick={handleSaveReflection}
                    className="w-full py-3 bg-emerald-500 text-white rounded-2xl font-bold text-xs hover:bg-emerald-600 shadow"
                >
                    Save Reflection & Finish Learning
                </button>
            </div>
        </div>
    );
}

function TeacherDashboardView({ modules, setModules, announcement, setAnnouncement, quizQuestions, setQuizQuestions, videoUrl, setVideoUrl, onResetData, showToast }) {
    const [editVideo, setEditVideo] = useState(videoUrl);

    const handleSaveTeacherData = () => {
        setVideoUrl(editVideo);
        localStorage.setItem('se_video_url', editVideo);
        showToast('Pengaturan Guru Berhasil Disimpan (Local Mode)', 'success');
    };

    const exportToCSV = () => {
        const quizScore = localStorage.getItem('se_last_quiz') || '0';
        const xp = localStorage.getItem('se_xp') || '0';
        const nickname = localStorage.getItem('se_nickname') || 'Student';
        
        const csvContent = "data:text/csv;charset=utf-8," 
            + "Nickname,XP_Points,Quiz_Score\n"
            + `${nickname},${xp},${quizScore}%\n`;

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "student_sports_events_report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    return (
        <div className="space-y-6">
            <div className="bg-amber-50 p-4 rounded-2xl border border-amber-300 text-amber-900 text-xs font-bold flex items-center justify-between">
                <span>🧑‍🏫 Teacher Demo Mode — Data disimpan pada localStorage perangkat ini.</span>
                <span className="bg-amber-200 px-2 py-1 rounded-lg">Kelas X Bahasa Inggris</span>
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                <h3 className="text-lg font-bold text-slate-800">Pengaturan Video Pembelajaran</h3>
                <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-700">URL Embed YouTube Video:</label>
                    <input 
                        type="text" 
                        value={editVideo} 
                        onChange={(e) => setEditVideo(e.target.value)}
                        className="w-full p-2.5 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-sky-400"
                    />
                </div>

                <div className="flex flex-wrap gap-3 pt-4 border-t border-slate-100">
                    <button onClick={handleSaveTeacherData} className="px-5 py-2.5 bg-sky-500 text-white rounded-xl font-bold text-xs hover:bg-sky-600">
                        Save Teacher Settings
                    </button>
                    <button onClick={exportToCSV} className="px-5 py-2.5 bg-emerald-500 text-white rounded-xl font-bold text-xs hover:bg-emerald-600">
                        Export Student Progress (CSV)
                    </button>
                    <button onClick={onResetData} className="px-5 py-2.5 bg-rose-500 text-white rounded-xl font-bold text-xs hover:bg-rose-600 ml-auto">
                        Reset All Demo Data
                    </button>
                </div>
            </div>
        </div>
    );
}

window.onload = function() {
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
};
